<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>Archive Ocellus Trainer</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: black;
        color: white;
        font-family: sans-serif;
      }

      canvas {
        image-rendering: pixelated;
      }

      #credits {
        position: absolute;
        bottom: 4px;
        left: 4px;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 0 8px;
        max-width: calc(100% - 8px);
        font-size: 11px;
        text-shadow: 1px 1px 0 black;
        pointer-events: none;
      }

      #maker_credit {
        flex-basis: 100%;
        margin: 0;
      }

      #maker_links {
        display: block;
      }

      #maker_links a {
        color: #ff981f;
        pointer-events: auto;
      }

      #credit_line {
        flex: 1 1 0;
        max-width: 60ch;
        margin: 0;
      }

      #app_version {
        margin: 0;
        white-space: nowrap;
        opacity: 0.8;
      }

      #drill_controls {
        position: absolute;
        bottom: 74px;
        left: 4px;
        display: flex;
        gap: 4px;
        margin: 0;
        font-size: 12px;
      }

      #drill_controls button,
      #run_result button {
        padding: 2px 8px;
        border: 1px solid #000;
        background: #5a5245;
        color: #ff981f;
        font: inherit;
        cursor: pointer;
      }

      #settings_menu,
      #whats_new_panel,
      #run_result {
        border: 2px solid #000;
        outline: 1px solid #5a5245;
        background: #3e3529;
        color: #ff981f;
        text-shadow: 1px 1px 0 black;
      }

      #settings_menu {
        position: absolute;
        bottom: calc(100% + 4px);
        left: 0;
        display: grid;
        gap: 6px;
        justify-items: start;
        max-height: calc(100vh - 120px);
        overflow-y: auto;
        padding: 8px;
        white-space: nowrap;
      }

      #settings_menu[hidden],
      #whats_new_panel[hidden] {
        display: none;
      }

      #whats_new_panel {
        position: absolute;
        bottom: calc(100% + 4px);
        left: 0;
        box-sizing: border-box;
        width: min(44ch, calc(100vw - 8px));
        max-height: calc(100vh - 120px);
        overflow-y: auto;
        padding: 8px 12px;
      }

      #whats_new_panel h2 {
        margin: 0 0 6px;
        font-size: 14px;
        color: #ffff00;
      }

      #whats_new_panel h3 {
        margin: 8px 0 4px;
        font-size: 12px;
      }

      #whats_new_panel ul {
        margin: 0 0 8px;
        padding-left: 16px;
        color: #fff;
      }

      #whats_new_panel li + li {
        margin-top: 4px;
      }

      .unseen_dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-left: 4px;
        border-radius: 50%;
        background: #ff0000;
        box-shadow: 0 0 0 1px #000;
        vertical-align: middle;
      }

      #seed {
        width: 10ch;
      }

      #run_result {
        position: absolute;
        top: 20%;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        padding: 12px 16px;
        text-align: center;
        font-size: 14px;
      }

      #run_result h2 {
        margin: 0 0 6px;
        font-size: 18px;
        color: #ffff00;
      }

      #run_result p {
        margin: 0 0 8px;
      }

      #game_chat {
        position: absolute;
        bottom: 84px;
        left: 4px;
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 14px;
        text-shadow: 1px 1px 0 black;
        pointer-events: none;
      }

      /* The SDK's FPS panel is a fixed 80x48 box at the top left, so the health bar starts below it. */
      #boss_health {
        position: absolute;
        top: 52px;
        left: 4px;
        box-sizing: border-box;
        display: grid;
        gap: 2px;
        width: 176px;
        padding: 2px 3px;
        border: 1px solid #000;
        outline: 1px solid #5a5245;
        background: #3e3529;
        font-size: 11px;
        line-height: 12px;
        text-shadow: 1px 1px 0 black;
        pointer-events: none;
      }

      #boss_health_label {
        display: flex;
        justify-content: space-between;
        gap: 4px;
        white-space: nowrap;
      }

      #boss_health_name {
        color: #ff981f;
      }

      #boss_health_value {
        color: #fff;
      }

      #boss_health_track {
        display: block;
        height: 9px;
        border: 1px solid #050403;
        background: #e00000;
      }

      #boss_health_fill {
        display: block;
        height: 100%;
        background: #00d900;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
